<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Not Found | Halios</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
    }
    .box {
      padding: 32px;
      border-radius: 16px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      max-width: 400px;
    }
    h1 { margin: 0 0 12px; color: #f8fafc; font-size: 28px; }
    p { margin: 0 0 20px; font-size: 14px; }
    a {
      display: inline-block;
      padding: 10px 20px;
      background: #6366f1;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
    }
    a:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>Tài nguyên này không tồn tại hoặc đã được chuyển vào vùng bảo mật.</p>
    <a href="/">Quay về trang chủ</a>
  </div>
</body>
</html>
